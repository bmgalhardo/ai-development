<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* The review board (tools/render_review.py): a sidebar tree beside one
   reading column, a drawer behind a menu button at phone width. One dark
   look; a game's board.css may override these tokens. */
:root {
  --night: #101a24;
  --night-raised: #16222e;
  --rule: #2a3a4a;
  --ink: #efe6d2;
  --ink-soft: #c9c2b2;
  --muted: #a9b3bf;
  --gold: #dfbd7e;
  --gold-bright: #f0d49c;
  --sky: #9fb2c4;
  --display: "EB Garamond", Garamond, "Times New Roman", serif;
  --body: Lato, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side: 270px;
  color-scheme: dark;
}
html { background: var(--night); }
body { background: var(--night); color: var(--ink); font: 17px/1.6 var(--body); margin: 0; }
a { color: var(--gold); }
a:hover { color: var(--gold-bright); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.side {
  position: fixed; top: 0; bottom: 0; left: 0; width: var(--side); z-index: 3;
  overflow-y: auto; background: var(--night); border-right: 1px solid var(--rule);
  padding: calc(18px + env(safe-area-inset-top, 0px)) 0 40px; box-sizing: border-box;
}
.side .brand { display: block; padding: 0 20px 14px; font: 500 22px/1.2 var(--display);
  color: var(--ink); text-decoration: none; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li ul { padding-left: 14px; }
.side a.node, .side span.node { display: block; padding: 6px 20px; text-decoration: none;
  color: var(--muted); font-size: 15px; line-height: 1.35; border-left: 2px solid transparent; }
.side a.node:hover { color: var(--ink); }
.side .group > .node { color: var(--ink-soft); font-weight: 700; margin-top: 10px; }
.side .group .group > .node { margin-top: 2px; }
.side .cycle-note { display: block; font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.side a.node[aria-current="page"] { color: var(--gold); border-left-color: var(--gold); }

.bar { display: none; }
.scrim { display: none; }
.page { margin-left: var(--side); }

@media (min-width: 900px) {
  .bar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2;
    padding: 0 8px; background: var(--night); border-bottom: 1px solid var(--rule); }
  .bar button { background: none; border: 0; color: var(--ink); min-width: 44px; min-height: 44px;
    display: grid; place-items: center; cursor: pointer; border-radius: 6px; }
  .bar .title { color: var(--muted); font-size: 15px; }
  body.sidebar-hidden .side { visibility: hidden; transform: translateX(-100%); }
  body.sidebar-hidden .page { margin-left: 0; }
}

@media (max-width: 899px) {
  .page { margin-left: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2;
    padding: env(safe-area-inset-top, 0px) 8px 0; background: var(--night); border-bottom: 1px solid var(--rule);
  }
  .bar button {
    background: none; border: 0; color: var(--ink); min-width: 44px; min-height: 44px;
    display: grid; place-items: center; cursor: pointer; border-radius: 6px;
  }
  .bar .title { min-width: 0; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side { transform: translateX(-100%); visibility: hidden; width: min(var(--side), 85vw);
    transition: transform 0.2s ease, visibility 0s linear 0.2s; }
  body.drawer .side { transform: none; visibility: visible; transition: transform 0.2s ease; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 2; background: rgba(4, 8, 12, 0.6); }
}

article p, article li { overflow-wrap: anywhere; }
article :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 60px; }
article td, article th { overflow-wrap: normal; }
main { max-width: 720px; margin: 0 auto; padding-inline: 18px; padding-block: 28px 80px; }
.source { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); }
.pager a { display: block; text-decoration: none; padding: 10px 0; min-height: 44px; box-sizing: border-box; }
.pager small { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pager span { font: 500 19px/1.3 var(--display); }
.pager .next { text-align: right; grid-column: 2; }
article h1 { font: 500 clamp(34px, 8vw, 46px)/1.08 var(--display); margin: 0 0 18px; text-wrap: balance; }
article h2 { font: 500 28px/1.2 var(--display); color: var(--gold); margin: 44px 0 12px; text-wrap: balance; }
article h3 { font: 700 18px/1.35 var(--body); margin: 28px 0 8px; }
article p, article li { color: var(--ink-soft); }
article ul, article ol { padding-left: 22px; }
article li { margin: 6px 0; }
article strong { color: var(--ink); }
article code { font: 0.86em var(--mono); color: var(--sky); }
article pre { background: var(--night-raised); padding: 14px; border-radius: 6px; overflow-x: auto; }
article hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0; }
article table { border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
article th, article td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); }
article th { color: var(--gold); }

/* A paragraph of screenshots: a row of phone shots. */
p.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
p.shots figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
p.shots img { width: 100%; border-radius: 8px; display: block; background: var(--night-raised); }
p.shots figcaption { font-size: 13px; line-height: 1.4; color: var(--muted); }
/* Effect recordings need their whole motion readable, including comet flights. */
p.shots figure:has(img[src$=".gif"]) { grid-column: 1 / -1; }
p.shots img[src$=".gif"] { width: auto; max-width: 100%; align-self: flex-start; }

/* The story: a line the game shows, and our notes. */
.line { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start;
  padding: 12px 0; border-top: 1px solid var(--rule); margin: 0; }
.line .who { font: 500 13px/1.9 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.line .who.her { color: var(--sky); }
.line .who.hint { color: var(--muted); }
.line .words { font: 400 20px/1.45 var(--display); color: var(--ink); min-width: 0; }
.line .key { grid-column: 2; font: 12px var(--mono); color: var(--muted); }
p.note { border-left: 2px solid var(--rule); padding-left: 14px; color: var(--muted); }
p.note em { font-style: italic; }

pre.raw { white-space: pre-wrap; font: 14px/1.5 var(--mono); color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
__EXTRA_HEAD__

<nav class="side" id="side" aria-label="__SITE_NAME__"><a class="brand" href="__BRAND_HREF__">__SITE_NAME__</a><ul id="tree"></ul></nav>
<div class="scrim" id="scrim"></div>
<div class="page">
  <header class="bar">
    <button type="button" id="menu" aria-label="Open the contents" aria-controls="side" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span class="title" id="bar-title"></span>
  </header>
  <main><p class="source" id="source"></p><article id="doc"></article><nav class="pager" id="pager" aria-label="Previous and next"></nav></main>
</div>

<script type="application/json" id="board-data">__BOARD_JSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("board-data").textContent);
  const tree = document.getElementById("tree");
  const doc = document.getElementById("doc");
  const source = document.getElementById("source");
  const pager = document.getElementById("pager");
  const menu = document.getElementById("menu");
  const barTitle = document.getElementById("bar-title");

  // The sidebar tree: a node with a key is a page; one with children is a group.
  function branch(nodes, list) {
    nodes.forEach((node) => {
      const li = document.createElement("li");
      const item = document.createElement(node.key ? "a" : "span");
      item.className = "node";
      item.textContent = node.label;
      if (node.note) {
        const note = document.createElement("span");
        note.className = "cycle-note";
        note.textContent = node.note;
        item.appendChild(note);
      }
      if (node.key) { item.href = "#" + node.key; item.dataset.key = node.key; }
      li.appendChild(item);
      if (node.children) {
        li.className = "group";
        const sub = document.createElement("ul");
        branch(node.children, sub);
        li.appendChild(sub);
      }
      list.appendChild(li);
    });
  }
  branch(data.tree, tree);

  // The drawer, at phone width.
  function drawer(open) {
    document.body.classList.toggle("drawer", open);
    menu.setAttribute("aria-expanded", String(open));
    menu.setAttribute("aria-label", open ? "Hide the contents" : "Show the contents");
    if (open) { const here = tree.querySelector('[aria-current="page"]'); (here || tree.querySelector("a")).focus(); }
  }
  const narrow = window.matchMedia("(max-width: 899px)");
  function updateMenu() {
    const open = narrow.matches ? document.body.classList.contains("drawer") : !document.body.classList.contains("sidebar-hidden");
    menu.setAttribute("aria-expanded", String(open));
    menu.setAttribute("aria-label", open ? "Hide the contents" : "Show the contents");
  }
  menu.addEventListener("click", () => {
    if (narrow.matches) drawer(!document.body.classList.contains("drawer"));
    else document.body.classList.toggle("sidebar-hidden");
    updateMenu();
  });
  narrow.addEventListener("change", updateMenu);
  updateMenu();
  document.getElementById("scrim").addEventListener("click", () => drawer(false));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && document.body.classList.contains("drawer")) { drawer(false); menu.focus(); }
  });
  document.getElementById("side").addEventListener("click", (event) => {
    if (event.target.closest("a")) drawer(false);
  });

  // A heading's id: GitHub's rule, kept in step with slug() in render_review.py.
  function slug(text) {
    return text.toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu, "").replace(/ /g, "-");
  }

  function decorate() {
    const seen = {};
    doc.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((h) => {
      const base = slug(h.textContent);
      const count = seen[base] || 0;
      seen[base] = count + 1;
      h.id = count ? base + "-" + count : base;
    });
    // A paragraph made only of images: a row of captioned shots.
    doc.querySelectorAll("p").forEach((p) => {
      const imgs = p.querySelectorAll("img");
      const onlyImages = imgs.length && Array.from(p.childNodes).every((n) =>
        n.nodeName === "IMG" || (n.nodeType === 3 && !n.textContent.trim()));
      if (!onlyImages) return;
      p.classList.add("shots");
      imgs.forEach((img) => {
        img.loading = "lazy";
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = img.alt;
        img.replaceWith(figure);
        figure.append(img, caption);
      });
    });
    doc.querySelectorAll("table").forEach((table) => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.replaceWith(wrap);
      wrap.appendChild(table);
    });
    // Story lines: **Speaker** · `key`: words.
    doc.querySelectorAll("p").forEach((p) => {
      const first = p.firstElementChild;
      const code = p.querySelector("code");
      if (!first || first.tagName !== "STRONG" || !code || p.firstChild !== first) return;
      const match = p.textContent.match(/^(\w+) · ([a-z0-9_.]+): ([\s\S]+)$/);
      if (!match) return;
      const line = document.createElement("div");
      line.className = "line";
      const who = document.createElement("span");
      who.className = "who " + match[1].toLowerCase();
      who.textContent = match[1];
      const words = document.createElement("span");
      words.className = "words";
      words.textContent = match[3];
      const key = document.createElement("span");
      key.className = "key";
      key.textContent = match[2];
      line.append(who, words, key);
      p.replaceWith(line);
    });
    doc.querySelectorAll("p").forEach((p) => {
      if (p.firstElementChild && p.firstElementChild.tagName === "EM" && p.firstChild === p.firstElementChild) p.classList.add("note");
    });
  }

  function pagerLink(key, word, className) {
    const a = document.createElement("a");
    a.href = "#" + key;
    a.className = className;
    const small = document.createElement("small");
    small.textContent = word;
    const span = document.createElement("span");
    span.textContent = data.pages[key].label;
    a.append(small, span);
    return a;
  }

  function show(key) {
    if (!data.pages[key]) key = data.start;
    const entry = data.pages[key];
    tree.querySelectorAll("a").forEach((a) => {
      if (a.dataset.key === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    source.textContent = entry.source;
    barTitle.textContent = entry.label;
    const at = data.order.indexOf(key);
    pager.replaceChildren();
    if (at > 0) pager.appendChild(pagerLink(data.order[at - 1], "Previous", "prev"));
    if (at >= 0 && at < data.order.length - 1) pager.appendChild(pagerLink(data.order[at + 1], "Next", "next"));
    if (window.marked) {
      doc.innerHTML = window.marked.parse(entry.text);
      decorate();
    } else {
      const pre = document.createElement("pre");
      pre.className = "raw";
      pre.textContent = entry.text;
      doc.replaceChildren(pre);
    }
    document.title = entry.label + " · __SITE_NAME__";
    try { localStorage.setItem("review-board-page", key); } catch (error) {}
  }

  // The hash is a page's key, and after a colon a heading's id in it.
  function current() {
    let hash = location.hash.slice(1);
    try { hash = decodeURIComponent(hash); } catch (error) {}
    const [key, anchor] = hash.split(":");
    if (data.pages[key]) return [key, anchor];
    try { const saved = localStorage.getItem("review-board-page"); if (data.pages[saved]) return [saved]; } catch (error) {}
    return [data.start];
  }
  function go() {
    const [key, anchor] = current();
    show(key);
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", go);
  go();

})();
</script>
