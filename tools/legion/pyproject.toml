[project]
name = "legion"
version = "0.1.0"
description = "Runs and observes the implementation of tickets by coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3"]

[project.scripts]
legion = "legion.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["httpx>=0.27,<1"]
