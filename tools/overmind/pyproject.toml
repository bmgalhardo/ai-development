[project]
name = "overmind"
version = "0.1.0"
description = "Runs and observes the implementation of tickets by coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.scripts]
overmind = "overmind.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx>=0.27,<1"]
